<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Вегас Макс-Слоты 5 Линий</title>
    <style>
        body {
            background: radial-gradient(circle, #240046 0%, #10002b 100%);
            color: #fff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        h1 {
            color: #ffb703;
            text-shadow: 0 0 15px #ffb703, 0 0 30px #ff5d00;
            margin-bottom: 5px;
            font-size: 2.2rem;
            text-align: center;
        }

        .info-lines {
            color: #e0aaff;
            font-style: italic;
            margin-bottom: 15px;
            font-size: 0.95rem;
        }

        #balance-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #06d6a0;
            text-shadow: 0 0 10px rgba(6, 214, 160, 0.5);
            margin-bottom: 20px;
        }

        /* Игровой автомат */
        .slot-machine {
            background: linear-gradient(145deg, #3c096c, #5a189a);
            border: 6px solid #ffb703;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 35px #7b2cbf, inset 0 0 15px #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* Сетка 3х3 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 12px;
            background-color: #121214;
            padding: 15px;
            border-radius: 12px;
            box-shadow: inset 0 0 20px #000;
        }

        .slot-cell {
            background: linear-gradient(135deg, #212529, #343a40);
            border: 2px solid #3d3d45;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            user-select: none;
            transition: background 0.2s, transform 0.1s;
        }

        .slot-cell.win-highlight {
            background: linear-gradient(135deg, #ffb703, #ffdd00);
            border-color: #fff;
            transform: scale(1.05);
            box-shadow: 0 0 15px #ffb703;
        }

        /* Панель управления */
        .controls {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .bet-container {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.2rem;
        }

        .btn-bet {
            background-color: #ff4d6d;
            color: white;
            border: none;
            padding: 5px 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-bet:hover { background-color: #ff758f; }
        .btn-bet.plus { background-color: #06d6a0; }
        .btn-bet.plus:hover { background-color: #2ec4b6; }

        .action-buttons {
            display: flex;
            gap: 15px;
        }

        .btn-main {
            padding: 12px 30px;
            font-size: 1.4rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: 0.2s;
        }

        #spin-btn {
            background: linear-gradient(to bottom, #ffb703, #ff9f00);
            color: #000;
        }
        #spin-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 7px 20px #ffb703; }
        #spin-btn:disabled { background: #555; color: #888; cursor: not-allowed; transform: none; }

        #auto-btn {
            background: #4a4e69;
            color: #fff;
        }
        #auto-btn.active {
            background: #06d6a0;
            color: #000;
            box-shadow: 0 0 15px #06d6a0;
        }

        /* Модальное окно Бонуса */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .bonus-content {
            background: linear-gradient(135deg, #1e0034, #340068);
            border: 4px solid #06d6a0;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 0 30px #06d6a0;
        }

        .safes-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 25px;
        }

        .safe {
            font-size: 4rem;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .safe:hover { transform: scale(1.15); }
    </style>
</head>
<body>

    <h1>💥 ВЕГАС МАКС-СЛОТЫ 💥</h1>
    <div class="info-lines">Активно линий: 5 (3 Горизонтали + 2 Диагонали)</div>
    <div id="balance-display">Фишки: 2000</div>

    <div class="slot-machine">
        <div class="grid-container" id="slot-grid">
            <!-- 9 ячеек сгенерируются через JavaScript -->
        </div>

        <div class="controls">
            <div id="total-bet-display" style="color: #ff4d6d; font-weight: bold;">Общая ставка: 50</div>
            
            <div class="bet-container">
                <button class="btn-bet" onclick="changeBet(-5)">-</button>
                <span id="bet-per-line-display">На линию: 10</span>
                <button class="btn-bet plus" onclick="changeBet(5)">+</button>
            </div>

            <div class="action-buttons">
                <button id="spin-btn" class="btn-main" onclick="startSpin()">СПИН 🎰</button>
                <button id="auto-btn" class="btn-main" onclick="toggleAuto()">АВТО: ВЫКЛ</button>
            </div>
        </div>
    </div>

    <!-- Бонусный раунд Сейфы -->
    <div class="modal" id="bonus-modal">
        <div class="bonus-content">
            <h2 style="color: #06d6a0; margin: 0;">🎁 БОНУСНЫЙ РАУНД!</h2>
            <p>Вы поймали 3 Алмаза! Выберите один из сейфов и заберите суперприз:</p>
            <div class="safes-container">
                <div class="safe" onclick="chooseSafe(0)">🧳</div>
                <div class="safe" onclick="chooseSafe(1)">🧳</div>
                <div class="safe" onclick="chooseSafe(2)">🧳</div>
            </div>
            <div id="bonus-result" style="margin-top: 20px; font-size: 1.3rem; font-weight: bold; color: #ffb703;"></div>
        </div>
    </div>

    <script>
        // Игровые настройки
        let balance = 2000;
        let betPerLine = 10;
        const linesCount = 5;
        let isSpinning = false;
        let autoMode = false;

        const symbols = {
            "7️⃣": 100, "💎": 50, "🔔": 30, "BAR": 20, "🍒": 10, "🍋": 5, "🍇": 3
        };
        const symbolList = Object.keys(symbols);

        // Веб-аудио контекст для синтеза звуков (без аудиофайлов)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            try {
                if (type === "spin") {
                    let osc = audioCtx.createOscillator();
                    let gain = audioCtx.createGain();
                    osc.type = "sine";
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.05);
                } else if (type === "win") {
                    [523.25, 659.25, 783.99].forEach((f, i) => {
                        let osc = audioCtx.createOscillator();
                        let gain = audioCtx.createGain();
                        osc.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.1);
                        gain.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.1);
                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.start(audioCtx.currentTime + i * 0.1);
                        osc.stop(audioCtx.currentTime + i * 0.1 + 0.1);
                    });
                } else if (type === "jackpot") {
                    let now = audioCtx.currentTime;
                    for (let i = 0; i < 4; i++) {
                        let osc = audioCtx.createOscillator();
                        osc.frequency.setValueAtTime(880, now + i * 0.2);
                        osc.connect(audioCtx.destination);
                        osc.start(now + i * 0.2); osc.stop(now + i * 0.2 + 0.15);
                    }
                }
            } catch (e) { console.log("Аудио пока заблокировано браузером"); }
        }

        // Инициализация сетки
        const gridContainer = document.getElementById("slot-grid");
        for (let i = 0; i < 9; i++) {
            let cell = document.createElement("div");
            cell.className = "slot-cell";
            cell.innerText = "7️⃣";
            gridContainer.appendChild(cell);
        }

        function changeBet(amount) {
            if (isSpinning) return;
            let newBet = betPerLine + amount;
            if (newBet >= 5 && newBet <= 100) {
                betPerLine = newBet;
                document.getElementById("bet-per-line-display").innerText = `На линию: ${betPerLine}`;
osc.type = "sine";
osc.frequency.setValueAtTime(300, audioCtx.currentTime);
gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
osc.connect(gain); gain.connect(audioCtx.destination);
osc.start(); osc.stop(audioCtx.currentTime + 0.05);
} else if (type === "win") {
[523.25, 659.25, 783.99].forEach((f, i) => {
let osc = audioCtx.createOscillator();
let gain = audioCtx.createGain();
osc.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.1);
gain.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.1);
osc.connect(gain); gain.connect(audioCtx.destination);
osc.start(audioCtx.currentTime + i * 0.1); osc.stop(audioCtx.currentTime + i * 0.1 + 0.1);
});
} else if (type === "jackpot") {
let now = audioCtx.currentTime;
for (let i = 0; i < 4; i++) {
let osc = audioCtx.createOscillator();
osc.frequency.setValueAtTime(880, now + i * 0.2);
osc.connect(audioCtx.destination);
osc.start(now + i * 0.2); osc.stop(now + i * 0.2 + 0.15);
}
}
} catch (e) {}
}
const gridContainer = document.getElementById("slot-grid");
for (let i = 0; i < 9; i++) {
let cell = document.createElement("div");
cell.className = "slot-cell";
cell.innerText = "7️⃣";
gridContainer.appendChild(cell);
}
function changeBet(amount) {
if (isSpinning) return;
let newBet = betPerLine + amount;
if (newBet >= 5 && newBet <= 100) {
betPerLine = newBet;
document.getElementById("bet-per-line-display").innerText = На линию: ${betPerLine};
document.getElementById("total-bet-display").innerText = Общая ставка: ${betPerLine * linesCount};
}
}
function toggleAuto() {
autoMode = !autoMode;
const autoBtn = document.getElementById("auto-btn");
if (autoMode) {
autoBtn.innerText = "АВТО: ВКЛ";
autoBtn.classList.add("active");
if (!isSpinning) startSpin();
} else {
autoBtn.innerText = "АВТО: ВЫКЛ";
autoBtn.classList.remove("active");
}
}
function startSpin() {
if (isSpinning) return;
let totalBet = betPerLine * linesCount;
if (balance < totalBet) {
autoMode = false;
document.getElementById("auto-btn").innerText = "АВТО: ВЫКЛ";
document.getElementById("auto-btn").classList.remove("active");
alert("Недостаточно фишек для ставки!");
return;
}
document.querySelectorAll(".slot-cell").forEach(c => c.classList.remove("win-highlight"));
isSpinning = true;
balance -= totalBet;
updateUI();
document.getElementById("spin-btn").disabled = true;
let count = 0;
let cells = document.querySelectorAll(".slot-cell");
let interval = setInterval(() => {
cells.forEach(c => c.innerText = activeSymbolList[Math.floor(Math.random() * activeSymbolList.length)]);
playSound("spin");
count++;
if (count > 12) {
clearInterval(interval);
finalResult();
}
}, 80);
}
function finalResult() {
let cells = document.querySelectorAll(".slot-cell");
let matrix = [[], [], []];
for (let r = 0; r < 3; r++) {
for (let c = 0; c < 3; c++) {
let sym = activeSymbolList[Math.floor(Math.random() * activeSymbolList.length)];
matrix[r][c] = sym;
cells[r * 3 + c].innerText = sym;
}
}
const lines = [
{ name: "Л1", coords: [[0,0], [0,1], [0,2]] },
{ name: "Л2", coords: [[1,0], [1,1], [1,2]] },
{ name: "Л3", coords: [[2,0], [2,1], [2,2]] },
{ name: "Л4", coords: [[0,0], [1,1], [2,2]] },
{ name: "Л5", coords: [[0,2], [1,1], [2,0]] }
];
let totalWin = 0;
let diamondCount = 0;
let hasJackpot = false;
matrix.forEach(row => row.forEach(sym => { if(sym === "💎") diamondCount++; }));
lines.forEach(line => {
let s1 = matrix[line.coords[0][0]][line.coords[0][1]];
let s2 = matrix[line.coords[1][0]][line.coords[1][1]];
let s3 = matrix[line.coords[2][0]][line.coords[2][1]];
if (s1 === s2 && s2 === s3) {
totalWin += betPerLine * symbols[s1];
if (s1 === "7️⃣") hasJackpot = true;
line.coords.forEach(coord => {
cells[coord[0] * 3 + coord[1]].classList.add("win-highlight");
});
}
});
if (totalWin > 0) {
balance += totalWin;
if (hasJackpot) playSound("jackpot");
else playSound("win");
}
if (diamondCount >= 3) {
setTimeout(() => { openBonusModal(); }, 600);
return;
}
endTurn();
}
function endTurn() {
if (balance < (betPerLine * linesCount) && !autoMode) {
if (balance < 5) {
alert("Фишки закончились! Держите бонусные 1000 фишек.");
balance += 1000;
}
}
updateUI();
isSpinning = false;
document.getElementById("spin-btn").disabled = false;
if (autoMode) setTimeout(startSpin, 1000);
}
function updateUI() {
document.getElementById("balance-display").innerText = Фишки: ${balance};
}
function openBonusModal() {
document.getElementById("bonus-result").innerText = "";
document.querySelectorAll(".safe").forEach(s => s.innerText = "🧳");
document.getElementById("bonus-modal").style.display = "flex";
}
function chooseSafe(index) {
let mults =;
mults.sort(() => Math.random() - 0.5);
let winAmount = betPerLine * mults[index];
balance += winAmount;
let safes = document.querySelectorAll(".safe");
safes[index].innerText = "💰";
document.getElementById("bonus-result").innerText = Вы нашли суперприз! Выигрыш: +${winAmount} фишек! (х${mults[index]});
playSound("win");
setTimeout(() => {
document.getElementById("bonus-modal").style.display = "none";
endTurn();
}, 2500);
}
