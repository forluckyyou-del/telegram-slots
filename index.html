<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Вегас Макс-Слоты 5 Линий</title>
    <style>
        body { background: radial-gradient(circle, #240046 0%, #10002b 100%); color: #fff; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        h1 { color: #ffb703; text-shadow: 0 0 15px #ffb703; margin-bottom: 20px; }
        #balance-display { font-size: 1.5rem; font-weight: bold; color: #06d6a0; margin-bottom: 20px; }
        .slot-machine { background: linear-gradient(145deg, #3c096c, #5a189a); border: 6px solid #ffb703; border-radius: 20px; padding: 20px; box-shadow: 0 0 35px #7b2cbf; display: flex; flex-direction: column; align-items: center; }
        iframe { border: none; border-radius: 12px; background: #121214; box-shadow: inset 0 0 20px #000; }
    </style>
</head>
<body>
    <h1>🎰 ВЕГАС МАКС-СЛОТЫ 🎰</h1>
    <div id="balance-display">Фишек: 2000</div>
    <div class="slot-machine">
        <!-- Безопасное подключение игрового ядра без поломок кода в чате -->
        <iframe src="https://github.io" width="340" height="480"></iframe>
    </div>
</body>
</html>
