<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎰 Вегас Макс-Слоты</title>
    <style>
        body {
            background: radial-gradient(circle, #240046 0%, #10002b 100%);
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            color: #ffb703;
            text-shadow: 0 0 15px #ffb703;
            margin-bottom: 20px;
        }
        .slot-machine {
            background: linear-gradient(145deg, #3c096c, #5a189a);
            border: 6px solid #ffb703;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 0 35px #7b2cbf;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Игровое поле */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 12px;
            background-color: #121214;
            padding: 15px;
            border-radius: 12px;
            overflow: hidden;
        }
        .slot-cell {
            background: linear-gradient(135deg, #212529, #343a40);
            border: 2px solid #3d3d45;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            user-select: none;
            position: relative;
        }
        /* Анимация вращения барабанов средствами CSS */
        .reel-spin {
            animation: spinEffect 0.2s linear infinite;
        }
        @keyframes spinEffect {
            0% { transform: translateY(-10px); }
            50% { transform: translateY(10px); }
            100% { transform: translateY(-10px); }
        }
        /* Элементы управления */
        .controls {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .info-panel {
            font-size: 1.2rem;
            font-weight: bold;
            color: #06d6a0;
            margin-bottom: 5px;
        }
        .btn-main {
            padding: 15px 40px;
            font-size: 1.6rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: linear-gradient(to bottom, #ffb703, #ff9f00);
            color: #000;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: 0.1s;
        }
        .btn-main:active {
            transform: scale(0.95);
            box-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }
        .lines-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 5px;
        }
        .line-btn {
            background: #4a4e69;
            color: #fff;
            border: 2px solid #3d3d45;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        /* Логика выбора линий кнопками без JS */
        .line-btn:focus {
            background: #06d6a0;
            color: #000;
            box-shadow: 0 0 10px #06d6a0;
        }
    </style>
</head>
<body>

    <h1>🎰 ВЕГАС МАКС-СЛОТЫ 🎰</h1>
    
    <div class="info-panel">Виртуальный баланс: 2500 фишек</div>

    <div class="slot-machine">
        <div class="grid-container">
            <!-- 9 ячеек игрового автомата с базовой CSS анимацией кручения -->
            <div class="slot-cell reel-spin">7️⃣</div>
            <div class="slot-cell reel-spin">🍒</div>
            <div class="slot-cell reel-spin">🍋</div>
            
            <div class="slot-cell reel-spin">💎</div>
            <div class="slot-cell reel-spin">7️⃣</div>
            <div class="slot-cell reel-spin">🔔</div>
            
            <div class="slot-cell reel-spin">BAR</div>
            <div class="slot-cell reel-spin">🍇</div>
            <div class="slot-cell reel-spin">7️⃣</div>
        </div>

        <div class="controls">
            <div style="color: #ff4d6d; font-weight: bold;">ВЫБЕРИТЕ КОЛИЧЕСТВО ЛИНИЙ:</div>
            <div class="lines-selector">
                <button class="line-btn">1 Линия</button>
                <button class="line-btn">3 Линии</button>
                <button class="line-btn" style="background: #06d6a0; color: #000;">5 Линий</button>
            </div>
            
            <div style="color: #e0aaff; font-size: 0.9rem; font-style: italic;">Текущая ставка: 50 фишек</div>
            
            <!-- Кнопка перезапускает CSS анимацию вращения при каждом нажатии -->
            <button class="btn-main" onclick="location.reload()">СПИН 🎰</button>
        </div>
    </div>

</body>
</html>
